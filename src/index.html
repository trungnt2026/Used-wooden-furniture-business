<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ĐỒ GỖ 2HAND</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
        <h1>ĐỒ GỖ 2HAND</h1>

    <nav>
        <a href="#">Trang chủ</a>
        <a href="#">Sản phẩm</a>
        <a href="#cart">Giỏ hàng (<span id="cartCount">0</span>)</a>
        <a href="#">Liên hệ</a>
    </nav>
</header>

<section class="banner">
    <h2>Nội thất gỗ cũ giá tốt</h2>
    <p>Chất lượng - Tiết kiệm - Bền đẹp</p>
</section>

<section class="products">

<div class="search-box">
    <input type="text" id="searchInput" placeholder="Tìm kiếm sản phẩm...">
    <button>Tìm kiếm</button>
</div>

<h2>Sản phẩm nổi bật</h2>

<div class="product-list">

    <div class="product" data-name="bàn gỗ cũ">
        <img src="./img/ban-go.png" alt="Bàn gỗ cũ">
        <h3>Bàn gỗ cũ</h3>
        <p>2.500.000đ</p>
        <button onclick="addToCart('Bàn gỗ cũ', 2500000)">
            Mua ngay
        </button>
    </div>

    <div class="product" data-name="ghế gỗ cũ">
        <img src="./img/ghe-go.png" alt="Ghế gỗ cũ">
        <h3>Ghế gỗ cũ</h3>
        <p>800.000đ</p>
        <button onclick="addToCart('Ghế gỗ cũ', 800000)">
            Mua ngay
        </button>
    </div>

    <div class="product" data-name="tủ gỗ cũ">
        <img src="./img/tu-go.png" alt="Tủ gỗ cũ">
        <h3>Tủ gỗ cũ</h3>
        <p>3.000.000đ</p>
        <button onclick="addToCart('Tủ gỗ cũ', 3000000)">
            Mua ngay
        </button>

    </div>
</div>

</section>

<section class="cart-section" id="cart">
    <h2>Giỏ hàng</h2>

    <ul id="cartItems"></ul>

    <h3>Tổng tiền <span id="totalPrice">0</span>đ</h3>
</section>

<footer>
    <p>© 2026 ĐỒ GỖ 2HAND</p>
</footer>
<script src="script.js"></script>
</body>
</html>
